    <title>头像玄学Crush分析器网页</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0719;
            --bg-mid: #1a103d;
            --gold: #d4af37;
            --gold-light: #e8c95b;
            --star-white: #e8e0f0;
            --neon-purple: #9b59b6;
            --neon-purple-light: #b97fd4;
            --card-bg: rgba(18, 10, 38, 0.55);
            --glow-color: rgba(212, 175, 55, 0.4);
            --glow-color-2: rgba(155, 89, 182, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            background-image:
                radial-gradient(ellipse at 30% 15%, rgba(155, 89, 182, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 85%, rgba(100, 140, 220, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 15% 75%, rgba(180, 120, 200, 0.07) 0%, transparent 45%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', 'Noto Serif SC', serif;
            color: var(--star-white);
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 星空Canvas */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* 流星 */
        .shooting-star {
            position: fixed;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0));
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: shootStar var(--duration) linear forwards;
            opacity: 0;
        }
        @keyframes shootStar {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(-25deg) scale(0.3);
            }
            8% {
                opacity: 1;
            }
            40% {
                opacity: 0.5;
                transform: translate(-400px, 300px) rotate(-25deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-700px, 520px) rotate(-25deg) scale(0.1);
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 560px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* 标题区 */
        .header {
            text-align: center;
            position: relative;
        }
        .header .title-icon {
            display: inline-block;
            width: 52px;
            height: 52px;
            margin-bottom: 8px;
            position: relative;
        }
        .header .title-icon svg {
            width: 100%;
            height: 100%;
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .header h1 {
            font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            background: linear-gradient(180deg, #f0e6c8 0%, #d4af37 40%, #b8922e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            margin: 0;
            line-height: 1.3;
            text-shadow: none;
        }
        .header .subtitle {
            font-size: 0.95rem;
            color: rgba(232, 224, 240, 0.65);
            letter-spacing: 0.12em;
            margin-top: 4px;
            font-style: italic;
        }

        /* 装饰分隔线 */
        .divider-ornament {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 300px;
            opacity: 0.5;
        }
        .divider-ornament .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .divider-ornament .diamond {
            width: 8px;
            height: 8px;
            background: var(--gold);
            transform: rotate(45deg);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
            animation: diamondPulse 2s ease-in-out infinite;
        }
        @keyframes diamondPulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
            }
            50% {
                box-shadow: 0 0 20px rgba(212, 175, 55, 1), 0 0 35px rgba(212, 175, 55, 0.5);
            }
        }

        /* 上传卡片 */
        .upload-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 20px;
            position: relative;
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.03),
                0 0 60px var(--glow-color);
            transition: all 0.5s ease;
            overflow: hidden;
        }
        .upload-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.5), transparent 40%, transparent 60%, rgba(155, 89, 182, 0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
        }
        .upload-card.has-image::before {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.7), transparent 35%, transparent 65%, rgba(155, 89, 182, 0.6));
        }

        /* 上传区域 */
        .upload-zone {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 200px;
            border: 2px dashed rgba(212, 175, 55, 0.45);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s ease;
            padding: 30px 20px;
            animation: uploadBreath 3s ease-in-out infinite;
            background: rgba(10, 6, 28, 0.35);
            overflow: hidden;
        }
        @keyframes uploadBreath {
            0%,
            100% {
                border-color: rgba(212, 175, 55, 0.4);
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.12), 0 0 40px rgba(155, 89, 182, 0.08);
            }
            50% {
                border-color: rgba(212, 175, 55, 0.75);
                box-shadow: 0 0 35px rgba(212, 175, 55, 0.28), 0 0 65px rgba(155, 89, 182, 0.18), 0 0 90px rgba(212, 175, 55, 0.08);
            }
        }
        .upload-zone:hover {
            border-color: rgba(212, 175, 55, 0.8);
            background: rgba(15, 9, 36, 0.5);
            box-shadow: 0 0 45px rgba(212, 175, 55, 0.25), 0 0 70px rgba(155, 89, 182, 0.2);
            transform: translateY(-2px);
        }
        .upload-zone.drag-over {
            border-color: var(--gold-light) !important;
            background: rgba(25, 14, 50, 0.6) !important;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.45), 0 0 100px rgba(155, 89, 182, 0.35) !important;
            transform: scale(1.02);
            animation: none !important;
        }
        .upload-zone .upload-icon-svg {
            width: 56px;
            height: 56px;
            margin-bottom: 12px;
            opacity: 0.7;
            transition: all 0.4s ease;
        }
        .upload-zone:hover .upload-icon-svg {
            opacity: 1;
            transform: scale(1.08);
        }
        .upload-zone .upload-text {
            font-size: 1rem;
            color: rgba(232, 224, 240, 0.7);
            letter-spacing: 0.05em;
            text-align: center;
            transition: color 0.3s;
        }
        .upload-zone .upload-hint {
            font-size: 0.8rem;
            color: rgba(232, 224, 240, 0.4);
            margin-top: 6px;
            letter-spacing: 0.04em;
        }

        /* 图片预览层 */
        .preview-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            border-radius: 16px;
            display: none;
            overflow: hidden;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: rgba(10, 6, 28, 0.8);
        }
        .preview-overlay.active {
            display: block;
        }
        .preview-overlay .preview-change-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: all 0.3s;
            font-family: inherit;
            z-index: 5;
        }
        .preview-overlay .preview-change-btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .preview-overlay .preview-glow-ring {
            position: absolute;
            inset: 8px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            pointer-events: none;
            box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.1);
        }

        /* 隐藏的file input */
        #fileInput {
            display: none;
        }

        /* 分析按钮 */
        .analyze-btn {
            z-index: 2;
            width: 100%;
            max-width: 340px;
            padding: 16px 32px;
            font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #0b0719;
            background: linear-gradient(135deg, #d4af37 0%, #e8c95b 30%, #c9a030 70%, #b8922e 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.35), 0 0 0 rgba(212, 175, 55, 0);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .analyze-btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 48px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
            pointer-events: none;
        }
        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.5), 0 0 80px rgba(212, 175, 55, 0.2);
            letter-spacing: 0.13em;
        }
        .analyze-btn:active:not(:disabled) {
            transform: translateY(-1px) scale(0.98);
            transition: all 0.1s ease;
        }
        .analyze-btn:disabled {
            background: linear-gradient(135deg, #5a5070 0%, #6e637f 100%);
            color: rgba(232, 224, 240, 0.45);
            cursor: not-allowed;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.08em;
        }
        .analyze-btn:disabled::after {
            background: none;
        }
        .analyze-btn.pulse-ready {
            animation: btnGlow 2s ease-in-out infinite;
        }
        @keyframes btnGlow {
            0%,
            100% {
                box-shadow: 0 6px 30px rgba(212, 175, 55, 0.35), 0 0 0 rgba(212, 175, 55, 0);
            }
            50% {
                box-shadow: 0 8px 45px rgba(212, 175, 55, 0.6), 0 0 70px rgba(212, 175, 55, 0.3);
            }
        }

        /* 结果卡片 */
        .result-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 28px 24px;
            position: relative;
            box-shadow:
                0 12px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.04),
                0 0 80px var(--glow-color),
                0 0 30px var(--glow-color-2);
            display: none;
            overflow: visible;
            transition: box-shadow 0.8s ease;
        }
        .result-card.visible {
            display: block;
            animation: resultFadeInUp 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }
        @keyframes resultFadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
                filter: blur(8px);
            }
            60% {
                opacity: 0.9;
                transform: translateY(-4px);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        .result-card .card-glow-orb {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--glow-color);
            filter: blur(70px);
            pointer-events: none;
            z-index: -1;
            top: -40px;
            right: -40px;
            opacity: 0.7;
            transition: background 0.8s ease;
        }
        .result-card .card-glow-orb.second {
            width: 140px;
            height: 140px;
            top: auto;
            bottom: -30px;
            left: -30px;
            right: auto;
            background: var(--glow-color-2);
            filter: blur(55px);
            opacity: 0.6;
        }
        .result-card .card-inner-border {
            position: absolute;
            inset: 6px;
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
            z-index: 0;
        }
        .result-card .corner-ornament {
            position: absolute;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }
        .result-card .corner-ornament.top-left {
            top: 14px;
            left: 14px;
            border-top: 2px solid rgba(212, 175, 55, 0.6);
            border-left: 2px solid rgba(212, 175, 55, 0.6);
            border-top-left-radius: 4px;
        }
        .result-card .corner-ornament.top-right {
            top: 14px;
            right: 14px;
            border-top: 2px solid rgba(212, 175, 55, 0.6);
            border-right: 2px solid rgba(212, 175, 55, 0.6);
            border-top-right-radius: 4px;
        }
        .result-card .corner-ornament.bottom-left {
            bottom: 14px;
            left: 14px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.6);
            border-left: 2px solid rgba(212, 175, 55, 0.6);
            border-bottom-left-radius: 4px;
        }
        .result-card .corner-ornament.bottom-right {
            bottom: 14px;
            right: 14px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.6);
            border-right: 2px solid rgba(212, 175, 55, 0.6);
            border-bottom-right-radius: 4px;
        }

        /* 结果内容 */
        .result-section {
            position: relative;
            z-index: 2;
            margin-bottom: 20px;
        }
        .result-section:last-child {
            margin-bottom: 0;
        }
        .result-section .section-label {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--gold);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-section .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.5), transparent);
            min-width: 30px;
        }
        .result-section .section-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
        }

        /* 标签 */
        .tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tag-item {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            background: rgba(155, 89, 182, 0.2);
            border: 1px solid rgba(155, 89, 182, 0.5);
            color: #d4b8e8;
            transition: all 0.4s ease;
            animation: tagPop 0.5s ease-out forwards;
            opacity: 0;
        }
        .tag-item:nth-child(1) {
            animation-delay: 0.2s;
        }
        .tag-item:nth-child(2) {
            animation-delay: 0.35s;
        }
        .tag-item:nth-child(3) {
            animation-delay: 0.5s;
        }
        @keyframes tagPop {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }
            70% {
                transform: scale(1.08);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 性格解析 */
        .analysis-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: rgba(232, 224, 240, 0.9);
            letter-spacing: 0.03em;
            font-style: italic;
            padding: 14px 18px;
            background: rgba(10, 5, 28, 0.4);
            border-radius: 12px;
            border-left: 3px solid rgba(212, 175, 55, 0.5);
            position: relative;
        }
        .analysis-text::before {
            content: '"';
            position: absolute;
            top: -10px;
            left: 8px;
            font-size: 3rem;
            color: rgba(212, 175, 55, 0.3);
            font-family: 'Playfair Display', Georgia, serif;
            line-height: 1;
        }

        /* 攻心策略 */
        .strategy-text {
            font-size: 1rem;
            line-height: 1.75;
            color: rgba(232, 224, 240, 0.85);
            letter-spacing: 0.03em;
            padding: 14px 18px;
            background: rgba(20, 12, 40, 0.35);
            border-radius: 12px;
            border-right: 3px solid rgba(155, 89, 182, 0.5);
            position: relative;
        }
        .strategy-text .highlight {
            color: var(--gold-light);
            font-weight: 500;
        }

        /* 加载覆盖层 */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(8, 4, 20, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* 星盘加载动画 */
        .astrolabe-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 28px;
        }
        .astrolabe-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .astrolabe-ring.ring-1 {
            width: 170px;
            height: 170px;
            border-style: dashed;
            border-color: rgba(212, 175, 55, 0.55);
            animation: spinClockwise 4s linear infinite;
        }
        .astrolabe-ring.ring-2 {
            width: 130px;
            height: 130px;
            border-style: solid;
            border-color: rgba(155, 89, 182, 0.5);
            animation: spinCounterClockwise 3.2s linear infinite;
        }
        .astrolabe-ring.ring-3 {
            width: 90px;
            height: 90px;
            border-style: dotted;
            border-width: 2px;
            border-color: rgba(212, 175, 55, 0.7);
            animation: spinClockwise 2.6s linear infinite;
        }
        .astrolabe-cross {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            height: 160px;
            animation: spinSlow 8s linear infinite;
        }
        .astrolabe-cross::before,

            content: '';
            position: absolute;
            background: rgba(212, 175, 55, 0.3);

            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;

        .astrolabe-cross::after {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;

        .astrolabe-core {
            position: absolute;

            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, #f0e6c8 0%, #d4af37 40%, #8b6914 100%);

            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);

        @keyframes spinCounterClockwise {
            from {
                transform: translate(-50%, -50%) rotate(0deg);

                transform: translate(-50%, -50%) rotate(-360deg);
            }
        }
        @keyframes spinSlow {

        @keyframes coreGlow {

    <script>
        (function() {
            // ==================== 星空背景Canvas ====================
            const starCanvas = document.getElementById('starCanvas');
            const starCtx = starCanvas.getContext('2d');
            let stars = [];
            const STAR_COUNT = 100;

            function resizeCanvas() {
                starCanvas.width = window.innerWidth;
                starCanvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initStars();
            });

            function initStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * starCanvas.width,
                        y: Math.random() * starCanvas.height,
                        r: Math.random() * 1.6 + 0.3,
                        baseAlpha: Math.random() * 0.7 + 0.3,
                        alpha: 0,
                        twinkleSpeed: Math.random() * 0.015 + 0.005,
                        twinkleOffset: Math.random() * Math.PI * 2,
                        driftX: (Math.random() - 0.5) * 0.15,
                        driftY: (Math.random() - 0.5) * 0.1,
                    });
                }
            }
            initStars();

            function drawStars(timestamp) {
                starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
                for (const s of stars) {
                    s.alpha = s.baseAlpha + Math.sin(timestamp * s.twinkleSpeed + s.twinkleOffset) * 0.35;
                    s.alpha = Math.max(0.08, Math.min(1, s.alpha));
                    s.x += s.driftX;
                    s.y += s.driftY;
                    if (s.x < -5) s.x = starCanvas.width + 5;
                    if (s.x > starCanvas.width + 5) s.x = -5;
                    if (s.y < -5) s.y = starCanvas.height + 5;
                    if (s.y > starCanvas.height + 5) s.y = -5;

                    starCtx.beginPath();
                    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    starCtx.fillStyle = `rgba(220,210,240,${s.alpha})`;
                    starCtx.fill();

                    // 亮星加辉光
                    if (s.r > 1.2 && s.alpha > 0.65) {
                        starCtx.beginPath();
                        starCtx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                        starCtx.fillStyle = `rgba(200,180,230,${s.alpha * 0.2})`;
                        starCtx.fill();
                    }
                }
            }

            function animateStars(timestamp) {
                drawStars(timestamp);
                requestAnimationFrame(animateStars);
            }
            requestAnimationFrame(animateStars);

                    star.remove();
                }, duration * 1000 + 200);
            }

                const delay = Math.random() * 12000 + 6000;
                setTimeout(() => {
                    spawnShootingStar();
                    scheduleMeteor();

            // ==================== 光晕颜色数组 ====================
            const glowColorSets = [
                { primary: 'rgba(212, 175, 55, 0.4)', secondary: 'rgba(155, 89, 182, 0.35)' },
                { primary: 'rgba(155, 89, 182, 0.45)', secondary: 'rgba(180, 130, 200, 0.3)' },
                { primary: 'rgba(100, 150, 220, 0.4)', secondary: 'rgba(140, 180, 230, 0.3)' },
                { primary: 'rgba(200, 140, 160, 0.42)', secondary: 'rgba(220, 160, 180, 0.32)' },
                { primary: 'rgba(80, 185, 155, 0.38)', secondary: 'rgba(120, 200, 175, 0.28)' },
                { primary: 'rgba(190, 160, 210, 0.4)', secondary: 'rgba(160, 130, 190, 0.33)' },
            ];

            // ==================== 加载提示文字 ====================
            const loadingMessages = [
                '正在感知能量场...',
                '星盘转动中，请静候...',
                '水晶球正在显影...',
                '塔罗之力汇聚中...',
                '解读灵魂印记...',
                '星辰在诉说...',
                '连接宇宙频率...',
                '占卜之眼正在睁开...',
            ];

            // ==================== 文件处理 ====================
            function handleFile(file) {
                if (!file) return;
                if (!file.type.match(/^image\/(jpeg|png)$/)) {
                    alert('请上传 JPG 或 PNG 格式的头像图片。');
                    return;
                }
                uploadedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewOverlay.style.backgroundImage = `url(${e.target.result})`;
                    previewOverlay.classList.add('active');
                    uploadZone.querySelector('.upload-icon-svg').style.opacity = '0';
                    uploadZone.querySelector('.upload-text').style.opacity = '0';
                    uploadZone.querySelector('.upload-hint').style.opacity = '0';
                    uploadCard.classList.add('has-image');
                    updateAnalyzeButtonState();
                    // 如果之前有结果，隐藏
                    if (resultCard.classList.contains('visible')) {
                        resultCard.classList.remove('visible');
                        resultCard.style.display = 'none';
                        analyzeBtn.textContent = '✦ 开始玄学分析 ✦';
                    }
                };
                reader.readAsDataURL(file);
            }

            // 点击上传
            uploadZone.addEventListener('click', (e) => {
                if (e.target === previewChangeBtn) return;
                if (isAnalyzing) return;
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFile(e.target.files[0]);
                }
            });

            // 更换按钮
            previewChangeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isAnalyzing) return;
                fileInput.click();
            });

            // 拖拽上传
            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!isAnalyzing) {
                    uploadZone.classList.add('drag-over');
                }
            });

            uploadZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('drag-over');
            });

            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('drag-over');
                if (isAnalyzing) return;
                const files = e.dataTransfer.files;
                if (files && files[0]) {
                    handleFile(files[0]);
                }
            });

            // 防止拖拽文件到页面其他位置时浏览器打开文件
            document.addEventListener('dragover', (e) => {
                e.preventDefault();
            });
            document.addEventListener('drop', (e) => {
                e.preventDefault();
            });

            // ==================== 性别选择 ====================
            const genderOptions = document.querySelectorAll('.gender-option');
            genderOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    if (isAnalyzing) return;
                    genderOptions.forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    selectedGender = opt.dataset.gender;
                    updateAnalyzeButtonState();
                });
            });

            // ==================== 分析按钮 ====================
            function updateAnalyzeButtonState() {
                if (uploadedFile && selectedGender) {
                    analyzeBtn.disabled = false;
                    analyzeBtn.classList.add('pulse-ready');
                } else {
                    analyzeBtn.disabled = true;
                    analyzeBtn.classList.remove('pulse-ready');
                }
            }

            analyzeBtn.addEventListener('click', () => {
                if (isAnalyzing) return;
                if (!uploadedFile) {
                    alert('请先上传一张头像图片，让星辰为你解读。');
                    return;
                }
                if (!selectedGender) {
                    alert('请先选择TA的性别，以便星盘准确运转。');
                    return;
                }
                startAnalysis();
            });

            function startAnalysis() {
                isAnalyzing = true;
                analyzeBtn.disabled = true;
                analyzeBtn.classList.remove('pulse-ready');
                resultCard.classList.remove('visible');
                resultCard.style.display = 'none';

                // 随机选择加载消息
                const randomMsg = loadingMessages[Math.floor(Math.random() * loadingMessages.length)];
                loadingText.innerHTML = randomMsg + '<span class="loading-dots">...</span>';

                // 显示加载覆盖层
                loadingOverlay.classList.add('active');

                // 随机加载时长 3.2s - 4.8s
                const loadDuration = Math.random() * 1600 + 3200;

                // 随机选择一组数据
                const randomIndex = Math.floor(Math.random() * analysisData.length);
                currentResultData = analysisData[randomIndex];

                // 随机选择光晕颜色
                const randomGlow = glowColorSets[Math.floor(Math.random() * glowColorSets.length)];

                setTimeout(() => {
                    // 隐藏加载覆盖层
                    loadingOverlay.classList.remove('active');

                    // 应用光晕颜色
                    glowOrb1.style.background = randomGlow.primary;
                    glowOrb2.style.background = randomGlow.secondary;
                    resultCard.style.setProperty('--glow-color', randomGlow.primary);
                    resultCard.style.setProperty('--glow-color-2', randomGlow.secondary);

                    // 填充结果
                    displayResult(currentResultData);

                    // 显示结果卡片
                    resultCard.style.display = 'block';
                    // 强制回流后添加动画类
                    void resultCard.offsetWidth;
                    resultCard.classList.add('visible');

                    // 恢复按钮
                    analyzeBtn.disabled = false;
                    analyzeBtn.textContent = '⟳ 重新占卜';
                    analyzeBtn.classList.add('pulse-ready');
                    isAnalyzing = false;

                    // 滚动到结果卡片
                    resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, loadDuration);
            }

            // 根据性别替换代词
            function applyGender(text) {
                if (selectedGender === 'female') {
                    return text.replace(/他/g, '她');
                }
                return text;
            }

            function displayResult(data) {
                // 标签
                tagsRow.innerHTML = '';
                data.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag-item';
                    span.textContent = tag;
                    tagsRow.appendChild(span);
                });

                // 性格解析（应用性别代词替换）
                analysisText.textContent = applyGender(data.analysis);

                // 攻心策略（应用性别代词替换）
                const genderedStrategy = applyGender(data.strategy);
                strategyText.textContent = genderedStrategy;
            }

            // ==================== 初始流星 ====================
            setTimeout(spawnShootingStar, 800);
            setTimeout(spawnShootingStar, 3500);

            // ==================== 键盘快捷键 ====================
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !isAnalyzing && uploadedFile && analyzeBtn.disabled === false) {
                    e.preventDefault();
                    analyzeBtn.click();
                }
            });

            console.log('🔮 头像玄学Crush分析器已就绪');
            console.log('   ✦ 上传头像 → 点击分析 → 静候星辰启示');
            console.log('   ✦ 预置 ' + analysisData.length + ' 组玄学分析数据');
            console.log('   ✦ 每组包含：命宫标签 | 深层性格解析 | 专属攻心策略');
            console.log('   ✦ 每次随机抽取，光晕颜色变幻，仪式感拉满');
        })();
    </script>
  <script id="md-click">
              window.mdClick = e => {
                const target = e.target;
                const {href, target: linkTarget} = target.dataset;
                const appType = 'web';
                const isBlank = linkTarget === '_blank';

                if (!href) return;

                e.stopPropagation();
                e.preventDefault();

                // 外部链接或新窗口打开
                if (isBlank || href.startsWith('http')) {
                  let finalHref = href;
                  if (appType === 'miniapp' && !href.startsWith('http')) {
                    finalHref = window.location.href.split('#')[0] + '#/' + href;
                  }
                  window.open(finalHref, linkTarget || '_self');
                  return;
                }

                // 内部路由跳转
                const finalHref = href.startsWith('/') ? href : '/' + href;
                if (appType === 'miniapp') {
                  window.location.hash = finalHref;
                  window.dispatchEvent(new HashChangeEvent('hashchange'));
                } else {
                  window.history.pushState({}, '', finalHref);
                  window.dispatchEvent(new Event('popstate'));
                }
              };
              document.addEventListener('click', window.mdClick, true);
            </script>
